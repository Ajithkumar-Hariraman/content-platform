services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command:
      [
        '-jar',
        'DynamoDBLocal.jar',
        '-sharedDb',
        '-dbPath',
        '/home/dynamodblocal/data',
      ]
    user: '0:0'
    ports:
      - '127.0.0.1:${DYNAMODB_HOST_PORT:-58000}:8000'
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dynamodb_data:
  postgres_data:
